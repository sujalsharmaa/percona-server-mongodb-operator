apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDBClusterSync
metadata:
  name: my-cluster-sync
spec:
  clusterName: my-cluster-name
  image: percona/percona-clustersync-mongodb:0.9.0
  mode: paused
  source:
    uri: mongodb://source-host:27017
    credentialsSecret: my-cluster-sync-source
    # tls:
    #   enabled: true
    #   secret: my-cluster-sync-source-tls
  # excludeNamespaces:
  #   - admin
  #   - local
  # expose:
  #   exposeType: ClusterIP
  # resources:
  #   requests:
  #     cpu: 500m
  #     memory: 512Mi
  #   limits:
  #     cpu: "2"
  #     memory: 2Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: my-cluster-sync-source
type: Opaque
stringData:
  username: REPLACE-WITH-SOURCE-USERNAME
  password: REPLACE-WITH-SOURCE-PASSWORD
